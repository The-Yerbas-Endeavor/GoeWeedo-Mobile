name: Fresh iOS Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  geoweedo:
    name: OG GeoWeedo iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: chmod +x scripts/build-ios.sh && scripts/build-ios.sh geoweedo
      - name: Name OG GeoWeedo build
        run: mv geoweedo-ios-simulator.zip og-geoweedo-ios-simulator.zip
      - uses: actions/upload-artifact@v6
        with:
          name: og-geoweedo-ios
          path: og-geoweedo-ios-simulator.zip
  scanner:
    name: Scanner iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: chmod +x scripts/build-ios.sh && scripts/build-ios.sh scanner
      - uses: actions/upload-artifact@v6
        with:
          name: scanner-ios
          path: scanner-ios-simulator.zip
