name: GeoWeedo iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geoweedo-mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build current iOS simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "$XCODE_APP" ]]; then
            echo 'Xcode 26 is not installed on this GitHub runner.' >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap Capacitor iOS
        run: |
          chmod +x scripts/mobile-bootstrap.sh
          ./scripts/mobile-bootstrap.sh ios

      - name: Verify current iOS configuration
        run: |
          TORCH_VERSION="$(node -p "require('./node_modules/@capawesome/capacitor-torch/package.json').version")"
          MLKIT_BARCODE_VERSION="$(node -p "require('./node_modules/@capacitor-mlkit/barcode-scanning/package.json').version")"
          echo "@capawesome/capacitor-torch=${TORCH_VERSION}"
          echo "@capacitor-mlkit/barcode-scanning=${MLKIT_BARCODE_VERSION}"
          test "${TORCH_VERSION}" = "8.0.2"
          test "${MLKIT_BARCODE_VERSION}" = "8.1.1"
          test -d node_modules/@capawesome/capacitor-torch
          test -d node_modules/@capacitor-mlkit/barcode-scanning
          test -f ios/App/App/Info.plist
          grep -q 'NSCameraUsageDescription' ios/App/App/Info.plist
          grep -q 'NSLocationWhenInUseUsageDescription' ios/App/App/Info.plist
          grep -q 'NSLocationAlwaysAndWhenInUseUsageDescription' ios/App/App/Info.plist
          grep -RqE 'CapawesomeCapacitorTorch|TorchPlugin|capacitor-torch' ios
          grep -RqE 'CapacitorMlkitBarcodeScanning|BarcodeScannerPlugin|barcode-scanning' ios
          node --version
          npm --version
          xcodebuild -version

      - name: Build GeoWeedo for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage current iOS artifact
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Build/Products/Debug-iphonesimulator/App.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo 'GeoWeedo simulator .app was not found' >&2
            exit 1
          fi

          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/geoweedo-ios-simulator.zip
          MLKIT_BARCODE_VERSION="$(node -p "require('./node_modules/@capacitor-mlkit/barcode-scanning/package.json').version")"
          TORCH_VERSION="$(node -p "require('./node_modules/@capawesome/capacitor-torch/package.json').version")"
          {
            echo "GeoWeedo Mobile iOS simulator build"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "node=22"
            echo "enhanced_barcode_scanner=@capacitor-mlkit/barcode-scanning@${MLKIT_BARCODE_VERSION}"
            echo "native_torch=@capawesome/capacitor-torch@${TORCH_VERSION}"
            echo "scanner_primary_mode=custom-mlkit"
            echo "scanner_manual_zoom=true"
            echo "scanner_native_torch=true"
            xcodebuild -version | sed 's/^/xcode=/'
          } > artifacts/BUILD-INFO.txt
          shasum -a 256 artifacts/geoweedo-ios-simulator.zip > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v6
        with:
          name: geoweedo-ios-simulator-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
