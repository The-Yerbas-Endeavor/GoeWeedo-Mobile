name: GeoWeedo Scanner Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'scripts/scanner-bootstrap.sh'
      - 'scripts/mobile-configure-native.mjs'
      - 'mobile-shell/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/scanner-android.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geoweedo-scanner-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build GeoWeedo Scanner APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API 36 tooling
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Bootstrap scanner Android
        run: |
          chmod +x scripts/scanner-bootstrap.sh
          ./scripts/scanner-bootstrap.sh android
      - name: Verify scanner identity
        working-directory: scanner/build
        run: |
          grep -Fq "appId: 'com.geoweedo.scanner'" capacitor.config.ts
          grep -Fq "appName: 'GeoWeedo Scanner'" capacitor.config.ts
          grep -Fq "url: 'https://geoweedo.com/scanner/app'" capacitor.config.ts
          grep -Rq 'com.geoweedo.scanner' android
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -RqE 'capacitor-mlkit|BarcodeScannerPlugin|BarcodeScanner' android
      - name: Build debug APK
        working-directory: scanner/build/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build unsigned release AAB
        working-directory: scanner/build/android
        run: ./gradlew --no-daemon bundleRelease
      - name: Stage artifacts
        run: |
          mkdir -p artifacts/scanner
          cp scanner/build/android/app/build/outputs/apk/debug/app-debug.apk artifacts/scanner/geoweedo-scanner-debug.apk
          cp scanner/build/android/app/build/outputs/bundle/release/app-release.aab artifacts/scanner/geoweedo-scanner-release-unsigned.aab
          printf '%s\n'             "GeoWeedo Scanner Android"             "app_id=com.geoweedo.scanner"             "app_name=GeoWeedo Scanner"             "web_origin=https://geoweedo.com/scanner/app"             "commit=${GITHUB_SHA}" > artifacts/scanner/BUILD-INFO.txt
          sha256sum artifacts/scanner/*.apk artifacts/scanner/*.aab > artifacts/scanner/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: geoweedo-scanner-android-apk-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/scanner/geoweedo-scanner-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: geoweedo-scanner-android-aab-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/scanner/geoweedo-scanner-release-unsigned.aab
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: geoweedo-scanner-android-build-info-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/scanner/BUILD-INFO.txt
            artifacts/scanner/SHA256SUMS.txt
          retention-days: 30
