name: Fresh Android Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  geoweedo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x scripts/build-app.sh && scripts/build-app.sh geoweedo
      - uses: actions/upload-artifact@v6
        with:
          name: geoweedo-fresh-apk
          path: build/geoweedo/android/app/build/outputs/apk/debug/app-debug.apk
  scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x scripts/build-app.sh && scripts/build-app.sh scanner
      - uses: actions/upload-artifact@v6
        with:
          name: geoweedo-scanner-fresh-apk
          path: build/scanner/android/app/build/outputs/apk/debug/app-debug.apk
