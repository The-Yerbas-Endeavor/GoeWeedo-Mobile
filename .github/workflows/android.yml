name: GeoWeedo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geoweedo-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build current APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Set up current Android SDK tooling
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 36 build tooling
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Capacitor Android
        run: |
          chmod +x scripts/mobile-bootstrap.sh
          ./scripts/mobile-bootstrap.sh android

      - name: Verify current Android configuration
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a=0,b=0,c=0]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(a*10000+b*100+c))")"
          grep -nE 'minSdkVersion|compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep -q 'minSdkVersion = 26' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q "versionName \"${APP_VERSION}\"" android/app/build.gradle
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q '@mipmap/geoweedo_launcher' android/app/src/main/AndroidManifest.xml
          grep -q '@mipmap/geoweedo_launcher_round' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable-nodpi/geoweedo_mascot.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/geoweedo_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/geoweedo_launcher_round.xml
          grep -q '@drawable/geoweedo_mascot' android/app/src/main/res/mipmap-anydpi-v26/geoweedo_launcher.xml
          grep -q '@color/geoweedo_launcher_background' android/app/src/main/res/mipmap-anydpi-v26/geoweedo_launcher.xml
          grep -q '#0F1D14' android/app/src/main/res/values/geoweedo_launcher_colors.xml
          java -version
          node --version
          npm --version
          sdkmanager --version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Stage current build artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/geoweedo-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/geoweedo-release-unsigned.aab
          APP_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "GeoWeedo Mobile Android build"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "app_version=${APP_VERSION}"
            echo "web_origin=https://geoweedo.com"
            echo "min_sdk=26"
            echo "compile_sdk=36"
            echo "target_sdk=36"
            echo "java=21"
            echo "node=22"
            echo "launcher_icon=adaptive-geoweedo-mascot"
            echo "brand_theme=#0F1D14"
          } > artifacts/BUILD-INFO.txt
          sha256sum artifacts/geoweedo-debug.apk artifacts/geoweedo-release-unsigned.aab > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: geoweedo-android-apk-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/geoweedo-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android AAB
        uses: actions/upload-artifact@v6
        with:
          name: geoweedo-android-aab-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/geoweedo-release-unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android build metadata
        uses: actions/upload-artifact@v6
        with:
          name: geoweedo-android-build-info-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
