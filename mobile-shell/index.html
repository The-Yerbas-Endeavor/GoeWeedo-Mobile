<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f1d14" />
  <meta name="color-scheme" content="dark" />
  <title>GeoWeedo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1d14;
      color: #f4f8f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 15%, rgba(80, 145, 92, .18), transparent 36rem),
        #0f1d14;
      color: #f4f8f4;
    }

    main {
      width: min(34rem, calc(100% - 2rem));
      text-align: center;
      padding:
        max(2rem, env(safe-area-inset-top))
        1.25rem
        max(2rem, env(safe-area-inset-bottom));
    }

    .mascot {
      display: block;
      width: min(11rem, 46vw);
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto 1rem;
      filter: drop-shadow(0 1rem 2rem rgba(0, 0, 0, .28));
    }

    h1 {
      margin: .25rem 0 .35rem;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .tagline {
      margin: 0 0 1.5rem;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .12em;
      opacity: .72;
    }

    .card {
      padding: 1.25rem;
      border: 1px solid rgba(244, 248, 244, .12);
      border-radius: 1rem;
      background: rgba(255, 255, 255, .045);
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .2);
    }

    p {
      margin: 0;
      line-height: 1.55;
      opacity: .84;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin-bottom: .8rem;
      font-size: .82rem;
      font-weight: 750;
      opacity: .76;
    }

    .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 999px;
      background: currentColor;
      opacity: .8;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: .95rem 1rem;
      border: 0;
      border-radius: .85rem;
      background: #f4f8f4;
      color: #0f1d14;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }

    button:active { transform: translateY(1px); }

    .hint {
      margin-top: .85rem;
      font-size: .8rem;
      opacity: .58;
    }
  </style>
</head>
<body>
  <main>
    <img class="mascot" src="./geoweedo-mascot.png" alt="GeoWeedo mascot" />
    <h1>GeoWeedo</h1>
    <p class="tagline">WEEDO SEARCH. WEEDO FIND. WEEDO PLAY.</p>

    <section class="card" aria-live="polite">
      <div class="status"><span class="dot"></span><span id="status">Connection unavailable</span></div>
      <p>GeoWeedo could not reach geoweedo.com. Check your connection and try again.</p>
      <button id="retry" type="button">Try GeoWeedo again</button>
      <p class="hint">The app will reopen the live GeoWeedo experience as soon as the site is reachable.</p>
    </section>
  </main>

  <script>
    const target = 'https://geoweedo.com';
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');

    function updateStatus() {
      status.textContent = navigator.onLine ? 'Ready to reconnect' : 'You appear to be offline';
    }

    retry.addEventListener('click', () => {
      status.textContent = 'Reconnecting…';
      window.location.replace(target);
    });

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
